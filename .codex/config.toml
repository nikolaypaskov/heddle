#:schema https://developers.openai.com/codex/config-schema.json

# Project layers load only after the repository has been trusted by the local
# Codex client. Keep the main model developer-selectable.
approval_policy = "on-request"
default_permissions = "heddle-workspace-edit"
web_search = "disabled"

[permissions.heddle-workspace-edit]
description = "Workspace edits without network access or sensitive file access."
extends = ":workspace"

[permissions.heddle-workspace-edit.filesystem]
glob_scan_max_depth = 12

[permissions.heddle-workspace-edit.filesystem.":workspace_roots"]
".env" = "deny"
".env.local" = "deny"
"**/.env.local" = "deny"
"secrets" = "deny"
"**/id_rsa*" = "deny"
"**/id_ed25519*" = "deny"
"**/*.p12" = "deny"
"**/*.mobileprovision" = "deny"
"**/AuthKey_*.p8" = "deny"

[permissions.heddle-workspace-edit.network]
enabled = false

[agents]
enabled = true
max_concurrent_threads_per_session = 4
