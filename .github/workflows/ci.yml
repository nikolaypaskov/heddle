# Heddle quality + security harness — CI tier.
#
# The local gate and this workflow share the public toolchain checks and the exact unit command.
# They are not identical coverage: heddle-privacy-gate.yml separately builds the GUI binary for
# endpoint scanning and self-tests the wasm gate. Keep those distinct scopes explicit.
#
# This complements the existing heddle-privacy-gate.yml (endpoint/asset/supply-chain
# scans) rather than replacing it. That workflow remains the authoritative privacy check.
#
# Supply chain: every `uses:` is pinned to a full 40-character commit SHA and every
# container image to an immutable @sha256: digest. Tags are mutable and can be repointed
# at malicious code — not hypothetical (tj-actions/changed-files, CVE-2025-30066).
# Trailing comments record the human-readable versions for Dependabot to bump.
#
# Note there is no `curl ... | sh` here. Fetching an installer over the network and
# piping it to a shell is the exact pattern this project removed from `script/bootstrap`,
# and policy/semgrep/heddle.yaml fails the build on it — a CI file that did it anyway
# would be the harness exempting itself from its own rule.

name: ci

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

# Least privilege. Escalate per-job only where a job genuinely needs more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # See the note on incremental compilation in .github/workflows/heddle-privacy-gate.yml
  # (it is set there for the same reason; there is no such note in this file).
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Does this diff touch anything that can change a build?
  #
  # Every job here used to run on every change, so a one-file docs edit compiled
  # 1.5M lines of Rust, built the GUI, and ran 6240 tests -- none of which an HTML
  # file can affect. The cheap gates still always run: they take seconds, and a
  # workflow that decides what to skip should not itself be skippable.
  #
  # Computed with `git diff` rather than a third-party action, so this adds no new
  # pinned dependency to a repo that pins every `uses:` to a full SHA.
  #
  # Fails OPEN. If the comparison cannot be made -- a shallow clone, a missing base
  # ref, a first push -- it reports `code=true` and everything runs. A filter that
  # guesses "nothing changed" when it cannot tell would skip the tests that catch
  # the mistake, so the safe direction is to do too much work rather than too little.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "not a pull_request (push or dispatch) -- running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) || [ -z "$files" ]; then
            echo "could not diff $BASE..$HEAD -- failing open, running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
          # Anything outside this list cannot change what the compiler produces.
          # Note ci.yml itself counts: a change to how the battery runs must run it.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|README\.md$|FAQ\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|AGENTS\.md$|\.github/workflows/heddle-(privacy-gate|release)\.yml$)'; then
            echo "-> build-affecting changes present"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> documentation/unrelated-workflow only; skipping the Rust battery"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Fast, no-toolchain checks. These fail in seconds, so they run first rather than
  # ── waiting behind a multi-minute Rust build.
  workflow-audit:
    name: workflow audit
    runs-on: ubuntu-latest
    container:
      # The workflow file is itself a supply-chain artifact. If its YAML is malformed
      # this job never starts, which is why the local gate runs both auditors too.
      image: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
      # The image's default user cannot write /__w/_temp/_runner_file_commands, so
      # actions/checkout died with EACCES before actionlint ever ran. The container only
      # reads the checkout and exits; it handles no secrets and produces no artifact.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to read.
          persist-credentials: false
      # Named files, not project auto-detection. Inside the container actionlint reports
      # "no project was found in any parent directories" -- it locates the repo by shelling
      # out to git, which does not agree about the checkout's ownership. Passing the paths
      # skips detection entirely and audits exactly what we mean to audit.
      - name: actionlint (syntax + shellcheck)
        run: actionlint -color .github/workflows/*.yml

  workflow-security:
    name: workflow security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to read.
          persist-credentials: false
      - name: zizmor
        # From PyPI at a pinned version — no fetch-and-execute.
        run: pipx run zizmor==1.27.0 --persona=regular .github/workflows/

  suppressions:
    name: suppression ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check diffs against the merge base, so it needs history, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: check for unledgered suppressions
        run: ./script/heddle/check-suppressions

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history scan covers commits introduced by this push or pull request.
          fetch-depth: 0
          # Do not leave the job token in .git/config for later steps to read.
          persist-credentials: false
      # Scan only commits introduced by pushes and pull requests. The manual-dispatch
      # path still runs the filesystem scans below without an event history range.
      - name: validate secret-scan history range
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
      - name: trufflehog (Git history)
        if: github.event_name != 'workflow_dispatch'
        uses: docker://trufflesecurity/trufflehog@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 # 3.96.0
        with:
          args: >-
            git file:///github/workspace
            --since-commit ${{ github.event.pull_request.base.sha || github.event.before }} --branch HEAD
            --github-actions --no-update --no-verification --fail --fail-on-scan-errors
      # Deliberately no path exclusions here: every added commit is untrusted, including
      # changes under fixture, baseline, vendored, and lockfile paths. The working-tree
      # exclusions below exist only to tolerate inherited material that this event did not add.
      # Whole-tree scan. The exclude file is REGEXES and must exclude .git/: the
      # incoming-history step above owns Git objects, while this step owns the checked-out
      # filesystem. Mixing them would rescan inherited history and local VCS metadata.
      - name: trufflehog (whole tree)
        uses: docker://trufflesecurity/trufflehog@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 # 3.96.0
        with:
          args: >-
            filesystem /github/workspace
            --github-actions --no-update --no-verification --fail --fail-on-scan-errors
            --exclude-paths /github/workspace/policy/trufflehog-exclude.txt

  sast:
    name: SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8 # 1.171.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to read.
          persist-credentials: false
      # Vendored, pinned, offline ruleset. Never --config auto: that makes results depend
      # on the registry's current state and stops being reproducible.
      - name: semgrep
        run: |
          set -euo pipefail
          # ERROR-severity rules block.
          semgrep scan --error --quiet --metrics=off --severity=ERROR --config policy/semgrep/ app crates
          # WARNING-severity rules report; see lefthook.yml for why they do not block.
          semgrep scan --quiet --metrics=off --config policy/semgrep/ app crates || true

  # ── The Rust battery. One job so the compile cache is shared across milestones;
  # ── splitting them would rebuild 1.5M lines per job.
  rust:
    name: rust battery
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pull requests run on GitHub-hosted infrastructure. Only master pushes may use
    # the configured heavy runner; an unset variable safely falls back to hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to read.
          persist-credentials: false

      - name: install the pinned toolchain
        # rust-toolchain.toml pins the version; `rustup show` installs exactly that.
        run: rustup show

      # Serialize package-manager access to avoid concurrent installation locks.
      - name: install build dependencies
        run: |
          set -euo pipefail
          sudo flock /tmp/heddle-ci-apt.lock bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends \
              libssl-dev pkg-config cmake libclang-dev unzip
          '

      # NOT apt's protobuf-compiler. That package ships the binary without putting the
      # well-known types where protoc looks for them, so the build fails with
      # "google/protobuf/descriptor.proto: File not found". heddle-release.yml already
      # installs protoc this way; this job did not, which is why it never once passed.
      - name: install protoc with well-known types
        env:
          PROTOC_VERSION: "25.1"
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      # Cache only on GitHub-hosted runners.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: heddle-ci

      - name: install pinned cargo tools
        run: |
          set -euo pipefail
          cargo install cargo-nextest --version 0.9.140 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      # Format is ADVISORY by repository policy — it reports, never blocks.
      - name: format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: lint
        run: cargo clippy --locked --workspace --exclude command-signatures-v2 --exclude integration --exclude remote_server

      - name: typecheck
        run: cargo check --locked -p warp -p warp_core -p warp_tui -p onboarding

      # SCOPE: the whole workspace minus three NAMED exclusions. Byte-identical to the
      # `unit` job in lefthook.yml — verify with `diff`, not by eye. It was NOT identical
      # for one round: this side carried `--no-fail-fast` and the local side did not, under
      # a comment claiming they matched. The reasons for each exclusion are written out in
      # lefthook.yml rather than duplicated here.
      #
      # This ran `-p warp -p warp_core -p warp_tui -p onboarding` and therefore skipped the
      # tests of 49 of the 52 crates under crates/ that have any. Measured warm on an
      # aarch64 dev machine: 6293 tests / 49.8s before, 9167 tests / 96.7s after.
      #
      # `--no-fail-fast` because this suite had never run on Linux until today, and it is
      # turning up host-dependent tests one at a time. Stopping at the first failure means one
      # ~25-minute cycle per test, and no way to tell whether the next fix is the last. Running
      # to completion costs a slower red build and buys the whole list at once; a green build
      # is unaffected, since nothing is failing to keep going past.
      - name: unit
        run: cargo nextest run --locked --no-fail-fast --workspace --exclude command-signatures-v2 --exclude integration --exclude remote_server

      # Drives the BUILT binary as a subprocess. Unattended: no TTY, no credentials,
      # no network.
      - name: e2e
        run: cargo nextest run --locked -p warp_tui --test '*'

      - name: build
        run: cargo build --locked -p warp_tui --bin heddle-tui

      # Advisory: a new advisory against a transitive dependency should be visible without
      # blocking every unrelated change. deny.toml records why each existing one is accepted.
      - name: dependency audit (advisory)
        run: cargo deny check advisories bans sources licenses
        continue-on-error: true

  # Blocks newly-introduced vulnerable dependencies on PRs. Needs a public repo or GHAS;
  # guarded so it skips cleanly rather than failing if the repository is ever made private.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to read.
          persist-credentials: false
      # Advisory until the repository's Dependency graph is switched on. The action hard
      # errors with "Dependency review is not supported on this repository" otherwise, which
      # is a repo setting no branch can satisfy -- and a check that is red for a reason the
      # author cannot fix teaches people to ignore red checks.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
          # This project is AGPL-3.0, so copyleft dependencies are compatible and must NOT
          # be denied here. deny.toml carries the real licence allowlist.
          comment-summary-in-pr: on-failure
