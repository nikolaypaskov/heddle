name: Heddle privacy gate

# The guarantee Heddle exists to make, enforced on every change.
#
# This is deliberately narrow and fast: it builds the OSS binary and asserts
# that no Warp first-party endpoint, credential, or telemetry destination is
# present in the artifact. It is the regression defence for a fork that tracks a
# fast-moving upstream, where a merge can silently reintroduce a hardcoded URL.
#
# What it does NOT do is prove the binary makes no network connections. See
# script/heddle/verify-no-warp-endpoints for the honest scope of the claim.
#
# Security note: no untrusted event data (PR titles, branch names, commit
# messages) is interpolated into any `run:` block here.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heddle-privacy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-warp-endpoints:
    name: Binary contains no Warp endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show   # installs the version pinned by rust-toolchain.toml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config unzip \
            libssl-dev libfreetype-dev libexpat1-dev libgit2-dev \
            libfontconfig1-dev libasound2-dev libclang-dev

      # protoc must come from the official release, NOT apt. Debian/Ubuntu's
      # protobuf-compiler ships the binary without the well-known type
      # definitions, so the build fails on
      # `google/protobuf/descriptor.proto: File not found`. Upstream extracts
      # include/* for the same reason (script/linux/install_build_deps).
      - name: Install protoc with well-known types
        env:
          PROTOC_VERSION: "25.1"
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: heddle-privacy-gate

      - name: Build the OSS binary
        run: cargo build -p warp_tui --bin heddle-tui --features standalone

      # Prove the scanner CAN fail before trusting it to pass. A verification
      # tool that cannot distinguish "checked and clean" from "did not really
      # check" converts uncertainty into false confidence. That has bitten this
      # project four separate times, so the gate self-tests every run.
      - name: Self-test the scanner against a planted canary
        run: |
          set -euo pipefail
          cp target/debug/heddle-tui /tmp/heddle-canary
          printf 'oz.warp.dev' >> /tmp/heddle-canary
          if ./script/heddle/verify-no-warp-endpoints /tmp/heddle-canary; then
            echo "::error::Scanner PASSED a binary containing a planted endpoint."
            echo "The scanner is broken; a clean result from it would be meaningless."
            exit 1
          fi
          echo "Scanner correctly rejected the canary."
          rm -f /tmp/heddle-canary

      - name: Verify no Warp endpoints in the binary
        run: ./script/heddle/verify-no-warp-endpoints

      - name: Verify bundled binary assets match the reviewed manifest
        run: ./script/heddle/verify-bundled-assets

      # Every wasm defect this fork has shipped was invisible to the host build: the code
      # sat behind `#[cfg(target_family = "wasm")]`, or was an import whose only wasm-side
      # consumer had been cfg'd out. Four of them landed before anyone built the target
      # once. A native check structurally cannot catch that class.
      #
      # This is a SET comparison, not pass/fail: the wasm target does not currently build
      # (ten pre-existing errors predating this fork), so "does it compile" is always no
      # and therefore worthless as a signal. What matters is whether a change makes it
      # worse.
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Same reasoning as the scanner self-test above: prove the gate CAN fail before
      # trusting it to pass. A check that cannot distinguish "clean" from "did not really
      # look" converts uncertainty into false confidence.
      - name: Self-test the wasm gate against a planted regression
        run: |
          set -euo pipefail
          target="app/src/terminal/view/pane_impl.rs"
          cp "$target" /tmp/pane_impl.bak
          # Delete the `#[cfg(not(target_arch = "wasm32"))]` line guarding the
          # PaneHeaderAction import, which makes that import unused on wasm and must
          # therefore trip the gate.
          line="$(grep -n 'use crate::pane_group::pane::view::PaneHeaderAction;' "$target" | cut -d: -f1)"
          if [ -z "$line" ]; then
            echo "::error::Self-test anchor not found in $target; update this step."
            exit 1
          fi
          sed -i "$((line - 1))d" "$target"
          if ./script/heddle/wasm-diagnostic-gate; then
            cp /tmp/pane_impl.bak "$target"
            echo "::error::The wasm gate PASSED a tree with a planted wasm-only regression."
            echo "The gate is broken; a clean result from it would be meaningless."
            exit 1
          fi
          cp /tmp/pane_impl.bak "$target"
          echo "Gate correctly rejected the planted unique regression."

          # Second plant, covering a DIFFERENT failure mode: a DUPLICATE of a diagnostic
          # already in the baseline. An earlier version of this gate used `sort -u`, which
          # discarded multiplicity -- three identical `?` errors in one file collapsed to a
          # single entry, so a fourth would have passed unnoticed. The plant above adds a
          # UNIQUE warning and therefore never exercised that path.
          dup="app/src/workspace/tab_settings.rs"
          cp "$dup" /tmp/tab_settings.bak
          dupline="$(grep -n 'use settings_value::SettingsValue as _;' "$dup" | head -1 | cut -d: -f1)"
          if [ -z "$dupline" ]; then
            echo "::error::Duplicate self-test anchor not found in $dup; update this step."
            exit 1
          fi
          sed -i "${dupline}a\\        use settings_value::SettingsValue as _;" "$dup"
          if ./script/heddle/wasm-diagnostic-gate; then
            cp /tmp/tab_settings.bak "$dup"
            echo "::error::The wasm gate PASSED a tree with a duplicated baseline diagnostic."
            echo "Multiplicity is not being compared; the gate has a false negative."
            exit 1
          fi
          cp /tmp/tab_settings.bak "$dup"
          echo "Gate correctly rejected the planted duplicate."

      - name: Compare wasm diagnostics against the recorded baseline
        run: ./script/heddle/wasm-diagnostic-gate
