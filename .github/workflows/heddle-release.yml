name: Heddle release

# Builds Heddle release artefacts and publishes them to a GitHub Release.
#
# The privacy gate runs against EVERY artefact before anything is published.
# A release that phones home would defeat the entire point of the fork, so the
# scan is a publish blocker, not an advisory check.
#
# Security note: values derived from the GitHub event (tag names, matrix
# targets) are passed to shell steps via `env:` and referenced as quoted shell
# variables. Nothing from the event payload is interpolated into `run:` text.

on:
  push:
    # `heddle-v*`, not `v*`. Every tag this project has ever cut is
    # `heddle-vX.Y.Z-macos-arm64`, so the old `v*` glob matched none of them and
    # this workflow never ran -- not once, across six releases. Everything below
    # it was written, reviewed and merged without ever executing: the Linux
    # artefacts it exists to build were never produced, and the manifest guard
    # that stops a release advertising an update it cannot serve never fired.
    #
    # A trigger that cannot match is indistinguishable from a workflow that
    # passes. Keep this glob in step with the tag shape in docs/HANDOFF.md.
    tags: ["heddle-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for manual runs)"
        required: true
        type: string

# Least privilege by default. Only the job that creates the release needs write, and it
# escalates for itself; a top-level `contents: write` handed that power to every job.
permissions:
  contents: read

concurrency:
  group: heddle-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # A release-LTO build of the GUI from a cold cache, plus cargo-about and the
    # AppImage packaging. The TUI this replaced built in a fraction of the time;
    # 120 minutes was sized for that, not for this.
    timeout-minutes: 300
    env:
      # linuxdeploy and appimagetool are themselves AppImages, and GitHub's
      # hosted runners have no FUSE. Without this they abort with "failed to set
      # up fuse"; with it they unpack themselves and run from a temp directory.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only, deliberately.
          #
          # This used to also build aarch64-apple-darwin, shipped UNSIGNED and NOT
          # NOTARIZED with a comment explaining why that was an acceptable trade.
          # It no longer is: macOS releases are the signed, notarized Heddle.app,
          # built and stapled on a developer machine (docs/HANDOFF.md). Publishing
          # an unsigned macOS binary beside it would hand users a quarantined
          # download next to one that opens cleanly, and undercut the provenance
          # claim the signed artefact makes.
          #
          # Linux ships the SAME GUI, as an AppImage plus native .deb and .rpm
          # packages. It previously shipped the
          # TUI because a comment here asserted "Linux has no GUI build" -- which
          # was already false: heddle-privacy-gate.yml has been compiling
          # `-p warp --bin heddle --features ...,gui` on Linux for some time. The
          # TUI is no longer released on any platform.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest

    steps:
      # Check out the exact ref being released. Without this, a manual run
      # accepts a tag input but builds whatever the default branch points at,
      # attaching a binary to a different tag's source archive. Under AGPL that
      # is a Corresponding Source mismatch, not just untidiness.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `github.ref`, NOT `inputs.tag`. On a tag push these are the same thing.
          # On a manual run they are not: `inputs.tag` supplies the VERSION STRING,
          # and a dry run's whole purpose is to build a tag that does not exist yet.
          # Checking it out failed the run in actions/checkout before a line of Rust
          # compiled. Dispatch from the ref you want built (`--ref master`); to
          # rebuild an old release, dispatch from that tag.
          ref: ${{ github.ref }}
          # Do not leave the job token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      # `clang` is NOT redundant with libclang-dev. heddle-privacy-gate.yml
      # installs both to compile the same GUI target; this list was missing it
      # because the TUI never needed it.
      #
      # The last three are linuxdeploy's runtime helpers: it shells out to
      # `file` for ELF detection, `desktop-file-validate` to check the entry it
      # is given, and `patchelf` to rewrite rpaths on the bundled libraries.
      #
      # `fakeroot`, `rpm` and `cpio` are for the native packages. Both bundlers
      # run their packaging tool under fakeroot so the archived files are owned
      # by root without the job being root; `rpm` supplies rpmbuild AND the
      # rpm2cpio used to unpack the result for scanning, and cpio is what reads
      # what rpm2cpio emits. dpkg-deb is part of the base image.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config unzip \
            libssl-dev libfreetype-dev libexpat1-dev libgit2-dev \
            libfontconfig1-dev libasound2-dev libclang-dev \
            clang \
            file desktop-file-utils patchelf \
            fakeroot rpm cpio

      - name: Install protoc with well-known types
        env:
          PROTOC_VERSION: "25.1"
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      # No build cache on the release path, deliberately.
      #
      # `save-if: false` would stop this workflow POISONING the shared cache, but not
      # stop it CONSUMING a cache another workflow poisoned -- and what this job produces
      # is an artefact the release notes make provenance claims about, published under a
      # checksum users are told to verify. A release build starts cold so that what ships
      # is built only from the committed source. The cost is a slower release build, which
      # is the right trade for the one workflow whose output users install.

      # `cargo about` is invoked by script/prepare_bundled_resources, which the
      # bundler calls while staging the AppImage. Install it BEFORE the bundle
      # step, not after: a missing cargo-about fails the build an hour in,
      # after the whole GUI has compiled.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      # linuxdeploy builds the AppDir and invokes appimagetool. Same pinned
      # version a developer gets from script/linux/bootstrap.
      #
      # The pin is checked against the download before it is installed -- it
      # previously checked only an ALREADY-CACHED copy, which on a fresh runner
      # is never the case, so this job downloaded and executed an unchecked
      # binary to build the artefact users install. That check establishes the
      # upstream build, not its provenance: the commit id is read by running the
      # binary. See the header of script/linux/install_linuxdeploy.
      - name: Install linuxdeploy
        run: |
          set -euxo pipefail
          ./script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and bundle the GUI (AppImage, .deb, .rpm)
        id: bundle
        # GIT_RELEASE_TAG is read via option_env! in warp_core, so the binary can report its own
        # version. Without it app_version() is None and the build claims to be whatever Cargo.toml
        # says, which is 0.1.0 and has never been bumped -- every release before v0.3.1 shipped
        # reporting 0.1.0. Cargo records this in the crate's dep-info as an env-dep, so changing the
        # tag correctly invalidates the build rather than silently reusing a cached one.
        #
        # `--release-tag` gets the APP version, not the git tag. This step used to
        # pass $RELEASE_TAG straight through, so the Linux artefact reported itself
        # as "heddle-v0.3.1-macos-arm64" -- a string HeddleVersion::parse rejects,
        # which the update client reads as "do not update". Same derivation as the
        # publish job below; see script/heddle/generate-release-manifest.
        #
        # This step used to set NO_SKILLS=1 and SKIP_SETTINGS_SCHEMA=1. Both are
        # gone, and the pair is why: NO_SKILLS deleted all eleven bundled skills
        # -- every one of them a LOCAL capability, none of them backed by a Warp
        # or Oz server -- so Linux shipped none while macOS shipped all eleven.
        # SKIP_SETTINGS_SCHEMA was justified BY that deletion ("its only consumer
        # is a bundled skill"), which stops being true the moment the skills come
        # back: `modify-settings` and `tui-migrate-setup` both render
        # {{settings_schema_path}} and would point at a file that is not there.
        #
        # SETTINGS_SCHEMA_CACHE matters more now than it did, not less. Each of
        # the three package formats stages its own copy of the bundled resources
        # (script/linux/bundle_install runs per format), and generating the
        # settings schema means a release-LTO `cargo run` of another bin. With
        # the cache set, the first format generates it and the other two copy.
        # See script/prepare_bundled_resources for the flag's contract.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SETTINGS_SCHEMA_CACHE: ${{ runner.temp }}/settings_schema.json
        run: |
          set -euo pipefail
          version="$(printf '%s' "$RELEASE_TAG" | sed -E 's/^heddle-//; s/-[a-z0-9]+-[a-z0-9]+$//')"
          if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not derive vX.Y.Z from tag '$RELEASE_TAG' (got '$version')." >&2
            exit 1
          fi
          echo "tag $RELEASE_TAG -> app version $version"
          ./script/bundle -c oss --packages appimage,deb,rpm --release-tag "$version"

      # A release artefact that phones home is worse than no release at all.
      #
      # The paths come from script/linux/bundle's own GITHUB_OUTPUT, not from a
      # hardcoded target/ path: the bundler picks its cargo profile directory
      # (release-lto) itself, and a stale hardcoded path here would scan a
      # binary from a previous run or fail outright.
      - name: Privacy gate (self-test, then scan)
        env:
          EXECUTABLE_PATH: ${{ steps.bundle.outputs.executable_path }}
        run: |
          set -euo pipefail
          test -f "$EXECUTABLE_PATH"
          cp "$EXECUTABLE_PATH" /tmp/heddle-canary
          printf 'oz.warp.dev' >> /tmp/heddle-canary
          if ./script/heddle/verify-no-warp-endpoints /tmp/heddle-canary; then
            echo "::error::Scanner passed a binary with a planted endpoint; it is broken."
            exit 1
          fi
          rm -f /tmp/heddle-canary
          ./script/heddle/verify-no-warp-endpoints "$EXECUTABLE_PATH"
          ./script/heddle/verify-bundled-assets

      # Three assets, each downloaded and used on its own. No tarball wrapper.
      #
      # The tarball that used to be the only Linux asset carried the AppImage
      # plus ~2 MB of `bundled/` skills and a settings_schema.json -- verified on
      # the shipped v0.5.0 artefact to be inert duplicates of files the AppImage
      # already contains at opt/heddle/heddle/resources/, which is where the app
      # actually reads them from. It also forced an extract step on a format
      # whose entire premise is chmod +x and run.
      #
      # What the tarball DID legitimately carry was LICENSE-AGPL and LICENSE-MIT,
      # which the AppImage did not. That is fixed at the source rather than here:
      # script/prepare_bundled_resources now stages both into every bundle's
      # resources directory, so all three formats carry them, and the verify step
      # below refuses to publish an artefact that does not.
      #
      # Paths come from the bundlers' own GITHUB_OUTPUT, not from globs over
      # dist/. A glob that matches nothing looks exactly like success; an
      # explicit path that does not exist is a failed test.
      - name: Package
        env:
          APPIMAGE_PATH: ${{ steps.bundle.outputs.appimage_path }}
          DEB_PATH: ${{ steps.bundle.outputs.deb_path }}
          RPM_PATH: ${{ steps.bundle.outputs.rpm_path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for artefact in "$APPIMAGE_PATH" "$DEB_PATH" "$RPM_PATH"; do
            if [ -z "$artefact" ]; then
              echo "::error::a bundler reported no path; expected all three of appimage_path, deb_path, rpm_path"
              exit 1
            fi
            if [ ! -f "$artefact" ]; then
              echo "::error::bundler reported '$artefact' but no such file exists"
              exit 1
            fi
            cp "$artefact" dist/
          done
          chmod +x "dist/$(basename "$APPIMAGE_PATH")"
          # Record each checksum with a BARE filename so `shasum -c` works from
          # the directory the user downloaded into. Recording "dist/<name>"
          # makes the documented verification command fail.
          ( cd dist && for f in *.AppImage *.deb *.rpm; do shasum -a 256 "$f" > "$f.sha256"; done )
          ls -l dist

      # Scan the ACTUAL packaged binary in EVERY format, not just the
      # pre-package executable. Codex flagged that "every release artefact is
      # scanned" was false when the tarball was assembled after the earlier scan;
      # adding two more formats reintroduces exactly that gap unless each one is
      # unpacked and scanned in its own right.
      #
      # Do NOT point the scanner at a container. An .AppImage payload is a
      # compressed squashfs, a .deb is an `ar` archive of compressed tarballs and
      # a .rpm is a compressed cpio -- in all three, string literals are absent
      # as literal bytes, so a scan of the container proves nothing whatsoever
      # about the contents. Unpack, then scan. `--appimage-extract` is handled by
      # the AppImage runtime and needs no FUSE.
      #
      # Self-test first, then scan: the canary run plants a real forbidden
      # endpoint in a copy of a shipped binary and requires the scanner to reject
      # it. A clean result from an uninstrumented scanner would be meaningless,
      # and this is the copy that is actually going to users.
      #
      # KNOWN LIMIT: this proves the shipped bytes are endpoint-free and that the
      # licences are present. It does not prove any of the three RUNS. Nothing
      # here launches them, so a broken AppRun, an Exec= pointing at a name that
      # is not on the image's PATH, a missing bundled resource directory, or a
      # postinst that fails on a real distro all pass this job and reach users.
      # Catching those needs a headless launch (xvfb plus a --version or
      # equivalent non-interactive entry point) that this job does not yet do.
      - name: Verify every packaged artefact
        run: |
          set -euo pipefail

          root="$(mktemp -d)"

          # Resolve each artefact and require exactly one match. `ls` on a
          # pattern that matched nothing would hand the literal pattern to the
          # next command; an empty result here is a failure with a name on it.
          for pattern in '*.AppImage' '*.deb' '*.rpm'; do
            mapfile -t matches < <(find dist -maxdepth 1 -name "$pattern")
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected exactly one dist/$pattern, found ${#matches[@]}"
              ls -1 dist || true
              exit 1
            fi
          done
          # Absolute, because the extraction commands below run from a temp dir.
          # Each glob is known to expand to exactly one path by the loop above.
          appimage="$(realpath dist/*.AppImage)"
          deb="$(realpath dist/*.deb)"
          rpm="$(realpath dist/*.rpm)"

          mkdir -p "$root/appimage" "$root/deb" "$root/rpm"
          chmod +x "$appimage"
          ( cd "$root/appimage" && "$appimage" --appimage-extract >/dev/null )
          dpkg-deb -x "$deb" "$root/deb"
          ( cd "$root/rpm" && rpm2cpio "$rpm" | cpio -idm --quiet )

          # Every format installs the program at the same path, so one locator
          # works for all three: the AppImage's usr/bin/heddle is a symlink to
          # the /opt copy, which is the regular file this finds. Requiring
          # exactly one match means a layout change is a failure rather than a
          # silently scanned wrong file.
          canary_done=0
          for format in appimage deb rpm; do
            mapfile -t hits < <(find "$root/$format" -type f -name heddle)
            if [ "${#hits[@]}" -ne 1 ]; then
              echo "::error::expected exactly one file named 'heddle' in the $format artefact, found ${#hits[@]}"
              printf '%s\n' "${hits[@]:-<none>}"
              exit 1
            fi
            binary="${hits[0]}"

            if [ "$canary_done" -eq 0 ]; then
              cp "$binary" /tmp/heddle-packaged-canary
              printf 'oz.warp.dev' >> /tmp/heddle-packaged-canary
              if ./script/heddle/verify-no-warp-endpoints /tmp/heddle-packaged-canary; then
                echo "::error::Scanner passed a packaged binary with a planted endpoint; it is broken."
                exit 1
              fi
              rm -f /tmp/heddle-packaged-canary
              canary_done=1
            fi

            echo "--- scanning the $format artefact ---"
            ./script/heddle/verify-no-warp-endpoints "$binary"

            # AGPL section 4: a copy of the licence must accompany the program.
            # The AppImage shipped without one until this release, so this is a
            # regression test with a known failing predecessor, not a formality.
            for licence in LICENSE-AGPL LICENSE-MIT THIRD_PARTY_LICENSES.txt; do
              if [ -z "$(find "$root/$format" -type f -name "$licence" -print -quit)" ]; then
                echo "::error::the $format artefact contains no $licence"
                exit 1
              fi
            done
            # And that the attribution file is the curated one, not a bare
            # cargo-about run that drops the non-Cargo notices.
            attribution="$(find "$root/$format" -type f -name THIRD_PARTY_LICENSES.txt -print -quit)"
            grep -q "Hack Font" "$attribution" \
              || { echo "::error::THIRD_PARTY_LICENSES.txt in the $format artefact is missing curated non-Cargo notices"; exit 1; }
          done

          # The native packages must DECLARE libasound. The AppImage cannot --
          # it has no dependency metadata at all, which is why its requirement is
          # documented in README.md, docs/index.html and docs/RELEASE_NOTES.md
          # instead. A package that declares nothing installs cleanly and then
          # dies with "libasound.so.2: cannot open shared object file"; that is
          # the same silent shape as an upload glob matching nothing, so it is
          # asserted here as well as in the bundlers.
          #
          # Captured into variables rather than piped into `grep -q`. Under
          # `set -o pipefail`, grep -q closes the pipe on its first match and the
          # writer can die of SIGPIPE, failing the pipeline -- which would report
          # "does not declare an ALSA dependency" precisely when it does.
          echo "--- declared dependencies ---"
          deb_depends="$(dpkg-deb -f "$deb" Depends)"
          printf '.deb Depends: %s\n' "$deb_depends"
          case "$deb_depends" in
            *libasound*) ;;
            *) echo "::error::the .deb does not declare an ALSA dependency"; exit 1 ;;
          esac
          rpm_requires="$(rpm -qp --requires "$rpm")"
          printf '.rpm Requires:\n%s\n' "$rpm_requires"
          case "$rpm_requires" in
            *libasound*|*alsa*) ;;
            *) echo "::error::the .rpm does not declare an ALSA dependency"; exit 1 ;;
          esac

      # `if-no-files-found: error` catches the case where NOTHING matched. It
      # does NOT catch one of three patterns matching nothing, which is why the
      # Package step checks each artefact by its exact path instead of trusting
      # these globs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heddle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256

  publish:
    # Tag pushes only. workflow_dispatch exists so the Linux AppImage build can be
    # exercised BEFORE committing to a release -- and with no condition here, it
    # could not be: every manual run reached `gh release create` and published.
    # A dry run that publishes is not a dry run, and the one path for catching a
    # broken bundle before users see it was the path that shipped it.
    if: startsWith(github.ref, 'refs/tags/')
    # This job creates the GitHub release, so it needs write. Scoped here rather
    # than at the top level, where it would apply to the build jobs too.
    permissions:
      contents: write
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Do not leave the job token in .git/config.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The update manifest. One implementation, shared with the manual GUI release flow
      # (docs/HANDOFF.md) -- the GUI is signed and notarized on a developer's machine, so the
      # manifest must be producible there too, and a second copy of this logic would be a
      # second thing to get out of step.
      - name: Generate the release manifest
        env:
          # Interpolated through the environment, never directly into the run: block.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        # Derive the APP version from the git tag. They are not the same string and
        # the difference is load-bearing: tags are `heddle-vX.Y.Z-macos-arm64`, while
        # the client parses `v?MAJOR.MINOR.PATCH` and refuses anything else, so the
        # manifest must carry `vX.Y.Z`. Passing $RELEASE_TAG straight through -- as
        # this did -- makes generate-release-manifest reject it and fail the release
        # at the one step that decides whether anyone is ever told about it.
        run: |
          set -euo pipefail
          version="$(printf '%s' "$RELEASE_TAG" | sed -E 's/^heddle-//; s/-[a-z0-9]+-[a-z0-9]+$//')"
          if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not derive vX.Y.Z from tag '$RELEASE_TAG' (got '$version')." >&2
            exit 1
          fi
          echo "tag $RELEASE_TAG -> app version $version"
          ./script/heddle/generate-release-manifest "$version" dist/channel_versions.json

      # Six assets: the AppImage, the .deb, the .rpm, and a .sha256 beside each.
      #
      # The list is built and CHECKED rather than handed to gh as a glob. A glob
      # that matches nothing is the specific failure this release path has to
      # avoid: bash leaves the unmatched pattern in place, gh may or may not
      # complain depending on what else matched, and either way a release can end
      # up short an asset while every step reports green. Requiring exactly one
      # match per format, plus its checksum, turns that into a named error.
      #
      # dist/channel_versions.json is written by the step above and is
      # deliberately not in this list -- it is published later, and only onto a
      # release that already carries the payload it advertises.
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets=()
          for pattern in '*.AppImage' '*.deb' '*.rpm'; do
            mapfile -t matches < <(find dist -maxdepth 1 -name "$pattern")
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected exactly one dist/$pattern among the downloaded artefacts, found ${#matches[@]}"
              ls -1 dist || true
              exit 1
            fi
            if [ ! -s "${matches[0]}.sha256" ]; then
              echo "::error::${matches[0]} has no recorded checksum"
              exit 1
            fi
            assets+=( "${matches[0]}" "${matches[0]}.sha256" )
          done
          printf 'publishing: %s\n' "${assets[@]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Heddle $RELEASE_TAG" \
              --notes-file docs/RELEASE_NOTES.md
          fi

      # The manifest is published ONLY onto a release that already carries the payload it
      # advertises.
      #
      # This workflow builds the Linux artefacts and nothing else; the macOS `.app.zip` is
      # signed and notarized on a developer's machine and uploaded by hand (docs/HANDOFF.md).
      # Publishing the manifest unconditionally therefore produced a release that told every
      # running Heddle a new version existed, and then 404'd when it went to fetch it -- and
      # because the client reads `releases/latest/download/`, one such release poisons the
      # check for everyone until the next one.
      #
      # The check stays macOS-specific because the updater is: it downloads
      # `Heddle-<arch>-apple-darwin.app.zip`, so a Linux artefact does not satisfy it no
      # matter how current it is. A Linux-only release is perfectly legitimate. It just must
      # not advertise a macOS update, so this skips rather than fails.
      - name: Publish the update manifest, if the app it points at is here
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -q 'Heddle-.*-apple-darwin\.app\.zip$'; then
            gh release upload "$RELEASE_TAG" dist/channel_versions.json --clobber
            echo "Published the manifest: the app bundle is on this release."
          else
            echo "::notice::No Heddle-*.app.zip on $RELEASE_TAG, so the update manifest was \
          NOT published. Upload the signed app bundle, then publish the manifest with \
          script/heddle/generate-release-manifest as described in docs/HANDOFF.md."
          fi
