<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Heddle">
  <!-- Heddle mark: warp threads lifted through eyelets, crossed by the shaft.
       Original work; not derived from Warp's marks. -->
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="6"  y1="4" x2="6"  y2="20"/>
    <line x1="12" y1="3" x2="12" y2="19"/>
    <line x1="18" y1="4" x2="18" y2="20"/>
    <line x1="3"  y1="12" x2="21" y2="12" stroke-width="2.2"/>
  </g>
  <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
</svg>
